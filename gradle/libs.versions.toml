[versions]
# Toolchain. AGP 8.13 is the last 8.x line and supports up to API 36.1.
agp = "8.13.0"
kotlin = "2.2.20"

# AndroidX
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
composeBom = "2025.09.00"

# Kotlin runtime. Declared explicitly rather than taken as a transitive of
# lifecycle-runtime-ktx, so the version is visible and pinned in one place.
coroutines = "1.9.0"

# ML Kit — bundled variants (offline, no Play Services dependency)
mlkitBarcode = "17.3.0"
mlkitTextRecognition = "16.0.1"

# CameraX 1.6.x (CameraPipe backend; use MlKitAnalyzer bridge)
camerax = "1.6.2"

# WorkManager for background jobs (nightly agent, sync)
workManager = "2.9.1"

# Phase 3 — On-device AI
# LiteRT-LM: orchestration layer for on-device LLMs (Gemma 270M INT4)
litert = "0.16.1"
# ONNX Runtime Mobile: size-optimised, covers all ops used by MiniLM-L6-v2 INT8
onnxruntime = "1.18.0"

# Test only
junit = "4.13.2"
orgJson = "20240303"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# The BOM pins every androidx.compose.* artifact, so those are declared without versions.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# A transitive of material3, but the UI imports foundation directly (LazyColumn,
# scrolling, clickable), so it is declared rather than relied on second-hand.
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# ML Kit — bundled (offline, not play-services-mlkit-*)
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

# CameraX
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
camerax-mlkit = { group = "androidx.camera", name = "camera-mlkit-vision", version.ref = "camerax" }

# WorkManager
workmanager-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# Phase 3 — On-device AI
# LiteRT-LM: Google's on-device LLM orchestration (Gemma 270M INT4 QAT)
litert-lm = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litert" }
# ONNX Runtime Mobile: inference for MiniLM-L6-v2 INT8 embedding model (bundled in assets)
onnxruntime-mobile = { group = "com.microsoft.onnxruntime", name = "onnxruntime-mobile", version.ref = "onnxruntime" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
# Android stubs org.json in unit tests, so the real implementation is needed on the test classpath.
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Required from Kotlin 2.0+; its version always tracks the Kotlin version.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
